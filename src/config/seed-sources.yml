# lantern default sources — broad, title-driven default set.
# Per-company boards (below) are a curated, slug-required quality tier: every
# slug here was live-probed (returned >0 jobs) when this list was generated.
# The role/keyword you set in Search filters these at L1; it does NOT need to
# match a company here. Breadth comes from the keyword aggregators at the end,
# which query by your keyword with no per-company config.
#
# There is no public "list all boards" endpoint for any of these ATSes, so the
# per-company tier is necessarily a maintained slug list. Add more under the
# matching board type. Slug = the tenant in the public board URL.
sources:
